    <header class="site-header">
      <div class="header-inner">
        <a
          class="identity"
          href="#about"
          data-view="about"
          aria-label="David Farcas home"
          ><span class="monogram">d<span>f</span><i>.</i></span
          ><span class="identity-name">DAVID<br />FARCAS</span></a
        >
        <nav
          class="app-navigation"
          id="navigation"
          role="tablist"
          aria-label="Portfolio sections"
        >
          <a
            id="tab-about"
            class="nav-tab is-active"
            href="#about"
            role="tab"
            tabindex="0"
            aria-controls="about"
            aria-selected="true"
            data-view="about"
            ><svg class="icon" aria-hidden="true">
              <use href="#i-home"></use></svg
            ><span>About</span></a
          >
          <a
            id="tab-experience"
            class="nav-tab"
            href="#experience"
            role="tab"
            tabindex="-1"
            aria-controls="experience"
            aria-selected="false"
            data-view="experience"
            ><svg class="icon" aria-hidden="true">
              <use href="#i-briefcase"></use></svg
            ><span>Experience</span></a
          >
          <a
            id="tab-contact"
            class="nav-tab"
            href="#contact"
            role="tab"
            tabindex="-1"
            aria-controls="contact"
            aria-selected="false"
            data-view="contact"
            ><svg class="icon" aria-hidden="true">
              <use href="#i-email"></use></svg
            ><span>Contact</span></a
          >
        </nav>
        <div class="header-tools">
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="Switch to light theme"
            aria-pressed="false"
          >
            <svg class="icon theme-sun" aria-hidden="true">
              <use href="#i-sun"></use></svg
            ><svg class="icon theme-moon" aria-hidden="true">
              <use href="#i-moon"></use>
            </svg>
          </button>
        </div>
      </div>
    </header>
