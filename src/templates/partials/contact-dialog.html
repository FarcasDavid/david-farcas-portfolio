    <dialog
      id="contact-form-dialog"
      class="contact-form-dialog"
      aria-labelledby="contact-form-title"
      aria-describedby="contact-form-note"
    >
      <div class="contact-form-heading">
        <p class="eyebrow">LET’S START A CONVERSATION</p>
        <button
          type="button"
          class="contact-form-close"
          data-close-contact-form
          aria-label="Close contact form"
        >
          ×
        </button>
      </div>
      <h2 id="contact-form-title">Tell me what’s on your mind<span>.</span></h2>
      <p id="contact-form-note">
        A question, an idea, or something worth building together? Send me a
        note right here.
      </p>
      <form
        id="contact-form"
        data-recipient="farcas.david@yahoo.com"
        action="https://formsubmit.co/ajax/farcas.david@yahoo.com"
        method="post"
      >
        <input
          type="text"
          name="_honey"
          hidden
          tabindex="-1"
          autocomplete="off"
        />
        <div class="contact-form-fields">
          <div class="form-field">
            <label for="contact-name">Your name</label>
            <input
              id="contact-name"
              name="name"
              type="text"
              autocomplete="name"
              maxlength="100"
              required
              autofocus
            />
          </div>
          <div class="form-field">
            <label for="contact-email">Your email</label>
            <input
              id="contact-email"
              name="email"
              type="email"
              autocomplete="email"
              maxlength="254"
              required
            />
          </div>
          <div class="form-field form-field-wide">
            <label for="contact-subject">Subject</label>
            <input
              id="contact-subject"
              name="subject"
              type="text"
              maxlength="160"
              required
            />
          </div>
          <div class="form-field form-field-wide">
            <label for="contact-message">Your message</label>
            <textarea
              id="contact-message"
              name="message"
              rows="5"
              maxlength="3000"
              required
            ></textarea>
          </div>
        </div>
        <div class="contact-form-actions">
          <button class="primary-button" type="submit">
            <span data-send-label>Send message</span>
            <span
              ><svg class="icon" aria-hidden="true">
                <use href="#i-arrow"></use></svg
            ></span>
          </button>
          <button class="copy-message-button" type="button" data-copy-message>
            <svg class="icon" aria-hidden="true"><use href="#i-copy"></use></svg
            >Copy message
          </button>
        </div>
        <p
          id="contact-form-status"
          class="contact-form-status"
          role="status"
          aria-live="polite"
        ></p>
        <p class="contact-form-fallback">
          Your email helps me reply. You can also reach me at
          <a href="mailto:farcas.david@yahoo.com">farcas.david@yahoo.com</a>.
        </p>
      </form>
    </dialog>
